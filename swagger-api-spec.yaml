openapi: 3.0.3
info:
  title: MyPlay API
  description: 뮤지컬, 콘서트 등 공연 정보와 리뷰를 관리하는 마이플레이 애플리케이션 API
  version: 1.0.0
  contact:
    name: Team 0479
    email: team0479@myplay.com

servers:
  - url: http://localhost:8080
    description: 개발 서버
  - url: https://api.myplay.com
    description: 운영 서버

tags:
  - name: Auth
    description: 인증 관련 API
  - name: User
    description: 사용자 관리 API
  - name: Calendar
    description: 캘린더 일정 관리 API
  - name: Review
    description: 리뷰 관리 API
  - name: Mission
    description: 미션 시스템 API
  - name: Badge
    description: 칭호 시스템 API
  - name: Home
    description: 홈 화면 API
  - name: Plaza
    description: 플라자 API

security:
  - bearerAuth: []

paths:
  # 인증 API
  /callback:
    get:
      tags:
        - Auth
      summary: 카카오 로그인 콜백
      description: 카카오 OAuth 인가 코드를 받아 JWT 토큰을 발급하고 앱으로 리디렉션
      security: []
      parameters:
        - name: code
          in: query
          required: true
          schema:
            type: string
          description: 카카오에서 전달받은 인가 코드
          example: "AQTKvXXXXXXXXXXXXXXXXX"
      responses:
        '302':
          description: 로그인 성공 후 앱으로 리디렉션
          headers:
            Location:
              description: 리디렉션 URL (myplay://callback?token={JWT_TOKEN}&refreshToken={REFRESH_TOKEN})
              schema:
                type: string
                example: "myplay://callback?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...&refreshToken=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        '400':
          description: 잘못된 인가 코드
        '500':
          description: 서버 오류

  /api/auth/kakao/login:
    post:
      tags:
        - Auth
      summary: 카카오 로그인 (직접 토큰 방식)
      description: 프론트엔드에서 받은 카카오 액세스 토큰으로 사용자 인증
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KakaoLoginRequest'
      responses:
        '200':
          description: 로그인 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: 잘못된 요청

  /refresh:
    post:
      tags:
        - Auth
      summary: 토큰 갱신
      description: Refresh Token을 사용하여 Access Token 갱신
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: 토큰 갱신 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefreshResponse'

  # 사용자 관리 API
  /api/users/me/profile:
    get:
      tags:
        - User
      summary: 현재 사용자 프로필 조회
      description: JWT 토큰에서 사용자 정보를 추출하여 로그인한 사용자의 프로필 정보 조회
      parameters:
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
          description: JWT Bearer Token
          example: "Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
      responses:
        '200':
          description: 프로필 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileResponse'
        '401':
          description: 인증 실패 (토큰 없음, 유효하지 않은 토큰)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 사용자를 찾을 수 없음

  /api/users/profile/check:
    get:
      tags:
        - User
      summary: 사용자 상태 확인
      description: JWT 토큰에서 사용자 정보를 추출하여 존재 여부와 프로필 완성도 확인
      parameters:
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
          description: JWT Bearer Token
          example: "Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
      responses:
        '200':
          description: 상태 확인 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserExistenceResponse'
        '401':
          description: 인증 실패

  /api/users/profile/setup:
    post:
      tags:
        - User
      summary: 초기 프로필 설정
      description: JWT 토큰에서 사용자 정보를 추출하여 최초 로그인 사용자의 프로필 설정
      parameters:
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
          description: JWT Bearer Token
          example: "Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InitialProfileSetupRequest'
      responses:
        '200':
          description: 프로필 설정 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          description: 인증 실패

  /api/users/profile/nickname/check:
    get:
      tags:
        - User
      summary: 닉네임 중복 확인
      description: 닉네임의 중복 여부 확인
      security: []
      parameters:
        - name: nickname
          in: query
          required: true
          schema:
            type: string
          description: 확인할 닉네임
      responses:
        '200':
          description: 중복 확인 완료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NicknameCheckResponse'

  # 캘린더 API
  /api/calendar/entries:
    post:
      tags:
        - Calendar
      summary: 캘린더 일정 등록
      description: JWT 토큰에서 사용자 정보를 추출하여 새로운 캘린더 일정 등록
      parameters:
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
          description: JWT Bearer Token
          example: "Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CalendarEntryCreateRequest'
      responses:
        '201':
          description: 일정 등록 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalendarEntryResponse'
        '401':
          description: 인증 실패

  /api/calendar/entries/user/{userId}:
    get:
      tags:
        - Calendar
      summary: 사용자 캘린더 조회
      description: 특정 사용자의 캘린더 일정 조회
      security: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
          description: 사용자 ID
      responses:
        '200':
          description: 캘린더 조회 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CalendarEntryResponse'

  /api/performances/search:
    get:
      tags:
        - Calendar
      summary: 공연 검색
      description: 키워드로 공연 검색
      security: []
      parameters:
        - name: keyword
          in: query
          required: true
          schema:
            type: string
          description: 검색 키워드
      responses:
        '200':
          description: 검색 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PerformanceSearchResponse'

  # 리뷰 API
  /api/reviews:
    post:
      tags:
        - Review
      summary: 리뷰 작성
      description: JWT 토큰에서 사용자 정보를 추출하여 새로운 리뷰 작성
      parameters:
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
          description: JWT Bearer Token
          example: "Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewCreateRequest'
      responses:
        '201':
          description: 리뷰 작성 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewCreateResponse'
        '401':
          description: 인증 실패

  /api/reviews/{reviewId}:
    get:
      tags:
        - Review
      summary: 리뷰 상세 조회
      description: 특정 리뷰의 상세 정보 조회
      security: []
      parameters:
        - name: reviewId
          in: path
          required: true
          schema:
            type: integer
          description: 리뷰 ID
      responses:
        '200':
          description: 리뷰 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewDetailResponse'

  /api/reviews/my:
    get:
      tags:
        - Review
      summary: 마이 리뷰 조회
      description: JWT 토큰에서 사용자 정보를 추출하여 현재 사용자가 작성한 모든 리뷰 조회
      parameters:
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
          description: JWT Bearer Token
          example: "Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
      responses:
        '200':
          description: 마이 리뷰 조회 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MyReviewResponse'
        '401':
          description: 인증 실패

  /api/reviews/my/rating/{rating}:
    get:
      tags:
        - Review
      summary: 평점별 마이 리뷰 조회
      description: JWT 토큰에서 사용자 정보를 추출하여 특정 평점의 리뷰만 조회
      parameters:
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
          description: JWT Bearer Token
          example: "Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        - name: rating
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 5
          description: 평점 (1-5)
      responses:
        '200':
          description: 평점별 리뷰 조회 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MyReviewResponse'
        '401':
          description: 인증 실패

  /api/reviews/my/category/{category}:
    get:
      tags:
        - Review
      summary: 카테고리별 마이 리뷰 조회
      description: JWT 토큰에서 사용자 정보를 추출하여 특정 카테고리의 리뷰만 조회
      parameters:
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
          description: JWT Bearer Token
          example: "Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        - name: category
          in: path
          required: true
          schema:
            type: string
          description: 공연 카테고리
      responses:
        '200':
          description: 카테고리별 리뷰 조회 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MyReviewResponse'
        '401':
          description: 인증 실패

  /api/reviews/my/statistics:
    get:
      tags:
        - Review
      summary: 마이 리뷰 통계
      description: JWT 토큰에서 사용자 정보를 추출하여 사용자의 리뷰 작성 통계 조회
      parameters:
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
          description: JWT Bearer Token
          example: "Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
      responses:
        '200':
          description: 통계 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewStatisticsResponse'
        '401':
          description: 인증 실패

  /api/comments:
    post:
      tags:
        - Review
      summary: 댓글 작성
      description: JWT 토큰에서 사용자 정보를 추출하여 리뷰에 댓글 작성
      parameters:
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
          description: JWT Bearer Token
          example: "Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommentCreateRequest'
      responses:
        '201':
          description: 댓글 작성 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommentResponse'
        '401':
          description: 인증 실패

  /api/comments/review/{reviewId}:
    get:
      tags:
        - Review
      summary: 댓글 조회
      description: 특정 리뷰의 댓글 조회
      security: []
      parameters:
        - name: reviewId
          in: path
          required: true
          schema:
            type: integer
          description: 리뷰 ID
      responses:
        '200':
          description: 댓글 조회 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CommentDetailResponse'

  # 미션 API
  /api/missions/me:
    get:
      tags:
        - Mission
      summary: 내 미션 조회
      description: JWT 토큰에서 사용자 정보를 추출하여 현재 사용자의 미션 목록 조회
      parameters:
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
          description: JWT Bearer Token
          example: "Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
      responses:
        '200':
          description: 미션 조회 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserMissionResponse'
        '401':
          description: 인증 실패

  /api/missions/user/{userId}:
    get:
      tags:
        - Mission
      summary: 사용자 미션 조회
      description: 특정 사용자의 미션 목록 조회
      security: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
          description: 사용자 ID
      responses:
        '200':
          description: 미션 조회 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserMissionResponse'

  /api/missions/assign/{userId}:
    post:
      tags:
        - Mission
      summary: 미션 할당
      description: 사용자에게 미션 할당
      security: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
          description: 사용자 ID
      responses:
        '200':
          description: 미션 할당 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'

  # 칭호 API
  /api/badges/me:
    get:
      tags:
        - Badge
      summary: 내 칭호 조회
      description: JWT 토큰에서 사용자 정보를 추출하여 현재 사용자의 모든 칭호 조회
      parameters:
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
          description: JWT Bearer Token
          example: "Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
      responses:
        '200':
          description: 칭호 조회 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserBadgeResponse'
        '401':
          description: 인증 실패

  /api/badges/me/acquired:
    get:
      tags:
        - Badge
      summary: 획득한 칭호만 조회
      description: JWT 토큰에서 사용자 정보를 추출하여 현재 사용자가 획득한 칭호만 조회
      parameters:
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
          description: JWT Bearer Token
          example: "Bearer eyJhbGciOiJ�UzI1NiIsInR5cCI6IkpXVCJ9..."
      responses:
        '200':
          description: 획득 칭호 조회 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserBadgeResponse'
        '401':
          description: 인증 실패

  /api/badges/award:
    post:
      tags:
        - Badge
      summary: 칭호 부여
      description: 사용자에게 칭호 부여
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BadgeAwardRequest'
      responses:
        '200':
          description: 칭호 부여 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'

  # 홈 화면 API
  /api/home/today-plays:
    get:
      tags:
        - Home
      summary: 오늘의 공연
      description: 오늘 상영하는 공연 정보 조회
      security: []
      responses:
        '200':
          description: 오늘의 공연 조회 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TodayPlayResponse'

  /api/home/popular-plays:
    get:
      tags:
        - Home
      summary: 인기 공연
      description: 인기 공연 목록 조회
      security: []
      responses:
        '200':
          description: 인기 공연 조회 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PopularPlayResponse'

  /api/home/best-reviews:
    get:
      tags:
        - Home
      summary: 베스트 리뷰
      description: 베스트 리뷰 목록 조회
      security: []
      responses:
        '200':
          description: 베스트 리뷰 조회 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BestReviewResponse'

  # 플라자 API
  /api/plaza/reviews:
    get:
      tags:
        - Plaza
      summary: 리뷰 플라자
      description: 플라자의 리뷰 목록 조회
      security: []
      responses:
        '200':
          description: 플라자 리뷰 조회 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ReviewPlazaResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    # 인증 관련 스키마
    KakaoLoginRequest:
      type: object
      required:
        - accessToken
        - email
      properties:
        accessToken:
          type: string
          description: 카카오 액세스 토큰
          example: "kakao_access_token_123"
        email:
          type: string
          format: email
          description: 사용자 이메일
          example: "user@example.com"

    LoginResponse:
      type: object
      properties:
        accessToken:
          type: string
          description: JWT 액세스 토큰
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        refreshToken:
          type: string
          description: JWT 리프레시 토큰
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        userId:
          type: integer
          description: 사용자 ID
          example: 1

    RefreshTokenRequest:
      type: object
      required:
