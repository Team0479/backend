openapi: 3.0.0
info:
  title: MyPlay API
  description: 공연 리뷰 및 관리 플랫폼 API
  version: 1.0.0
  contact:
    name: MyPlay Team
    email: support@myplay.com

servers:
  - url: http://localhost:8080
    description: 로컬 개발 서버
  - url: https://api.myplay.com
    description: 프로덕션 서버

security:
  - bearerAuth: []

paths:
  # 인증 API
  /api/auth/kakao/login:
    post:
      tags:
        - Auth
      summary: 카카오 로그인
      description: 카카오 소셜 로그인을 처리합니다
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KakaoLoginRequest'
      responses:
        '200':
          description: 로그인 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: 잘못된 요청
        '401':
          description: 인증 실패

  # 사용자 API
  /api/users/me/profile:
    get:
      tags:
        - User
      summary: 내 프로필 조회
      description: 현재 로그인한 사용자의 프로필 정보를 조회합니다
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 프로필 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileResponse'

  /api/users/profile/check:
    get:
      tags:
        - User
      summary: 사용자 존재 여부 확인
      description: 이메일로 사용자 존재 여부를 확인합니다
      security: []
      parameters:
        - name: email
          in: query
          required: true
          schema:
            type: string
            format: email
          description: 확인할 이메일
      responses:
        '200':
          description: 확인 완료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserExistenceResponse'

  /api/users/profile/setup:
    post:
      tags:
        - User
      summary: 초기 프로필 설정
      description: 신규 사용자의 초기 프로필을 설정합니다
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InitialProfileSetupRequest'
      responses:
        '200':
          description: 프로필 설정 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'

  /api/users/profile/nickname/check:
    get:
      tags:
        - User
      summary: 닉네임 중복 확인
      description: 닉네임의 중복 여부를 확인합니다
      security: []
      parameters:
        - name: nickname
          in: query
          required: true
          schema:
            type: string
          description: 확인할 닉네임
      responses:
        '200':
          description: 확인 완료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'

  # 캘린더 API
  /api/calendar/entries:
    post:
      tags:
        - Calendar
      summary: 일정 등록
      description: 새로운 관람 일정을 등록합니다
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CalendarEntryCreateRequest'
      responses:
        '201':
          description: 일정 등록 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalendarEntryResponse'

  /api/calendar/entries/user/{userId}:
    get:
      tags:
        - Calendar
      summary: 사용자 일정 조회
      description: 특정 사용자의 관람 일정을 조회합니다
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: 사용자 ID
        - name: date
          in: query
          required: false
          schema:
            type: string
            format: date
          description: 조회할 날짜 (YYYY-MM-DD)
      responses:
        '200':
          description: 일정 조회 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CalendarEntryResponse'

  /api/calendar/performances/search:
    get:
      tags:
        - Calendar
      summary: 공연 검색
      description: 공연명으로 공연을 검색합니다 (자동완성)
      security: []
      parameters:
        - name: title
          in: query
          required: true
          schema:
            type: string
          description: 검색할 공연명
      responses:
        '200':
          description: 검색 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PerformanceSearchResponse'

  /api/calendar/performances/{performanceId}:
    get:
      tags:
        - Calendar
      summary: 공연 상세 조회
      description: 특정 공연의 상세 정보를 조회합니다
      security: []
      parameters:
        - name: performanceId
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: 공연 ID
      responses:
        '200':
          description: 공연 상세 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PerformanceSearchResponse'

  # 리뷰 API
  /api/reviews:
    get:
      tags:
        - Review
      summary: 리뷰 목록 조회
      description: 리뷰 목록을 조회합니다
      security: []
      responses:
        '200':
          description: 리뷰 목록 조회 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ReviewResponse'

  /api/reviews/create:
    post:
      tags:
        - Review
      summary: 리뷰 작성
      description: 새로운 리뷰를 작성합니다
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewCreateRequest'
      responses:
        '201':
          description: 리뷰 작성 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewCreateResponse'

  /api/reviews/{reviewId}:
    get:
      tags:
        - Review
      summary: 리뷰 상세 조회
      description: 특정 리뷰의 상세 정보를 조회합니다
      security: []
      parameters:
        - name: reviewId
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: 리뷰 ID
        - name: userId
          in: query
          required: false
          schema:
            type: integer
            format: int64
          description: 사용자 ID (좋아요 상태 확인용)
      responses:
        '200':
          description: 리뷰 상세 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewDetailResponse'

  /api/reviews/{reviewId}/like:
    post:
      tags:
        - Review
      summary: 리뷰 좋아요 토글
      description: 리뷰에 좋아요를 추가하거나 취소합니다
      security:
        - bearerAuth: []
      parameters:
        - name: reviewId
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: 리뷰 ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - userId
              properties:
                userId:
                  type: integer
                  format: int64
                  description: 사용자 ID
      responses:
        '200':
          description: 좋아요 토글 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'

  /api/reviews/my:
    get:
      tags:
        - Review
      summary: 내 리뷰 목록 조회
      description: 현재 로그인한 사용자의 모든 리뷰를 조회합니다
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 내 리뷰 조회 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MyReviewResponse'

  /api/reviews/my/rating/{rating}:
    get:
      tags:
        - Review
      summary: 평점별 내 리뷰 조회
      description: 특정 평점의 내 리뷰를 조회합니다
      security:
        - bearerAuth: []
      parameters:
        - name: rating
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 5
          description: 평점 (1-5)
      responses:
        '200':
          description: 평점별 리뷰 조회 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MyReviewResponse'

  /api/reviews/my/category/{category}:
    get:
      tags:
        - Review
      summary: 카테고리별 내 리뷰 조회
      description: 특정 카테고리의 내 리뷰를 조회합니다
      security:
        - bearerAuth: []
      parameters:
        - name: category
          in: path
          required: true
          schema:
            type: string
            enum: [musicals, concerts, sports, exhibitions]
          description: 공연 카테고리
      responses:
        '200':
          description: 카테고리별 리뷰 조회 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MyReviewResponse'

  /api/reviews/my/statistics:
    get:
      tags:
        - Review
      summary: 내 리뷰 통계
      description: 현재 로그인한 사용자의 리뷰 통계를 조회합니다
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 리뷰 통계 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewStatisticsResponse'

  # 댓글 API
  /api/comments:
    post:
      tags:
        - Review
      summary: 댓글 작성
      description: 리뷰에 댓글을 작성합니다
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommentCreateRequest'
      responses:
        '201':
          description: 댓글 작성 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommentResponse'

  /api/comments/review/{reviewId}:
    get:
      tags:
        - Review
      summary: 리뷰 댓글 목록 조회
      description: 특정 리뷰의 댓글 목록을 조회합니다
      security: []
      parameters:
        - name: reviewId
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: 리뷰 ID
      responses:
        '200':
          description: 댓글 목록 조회 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CommentResponse'

  # 미션 API
  /api/missions/me:
    get:
      tags:
        - Mission
      summary: 내 미션 목록 조회
      description: 현재 로그인한 사용자의 미션 목록을 조회합니다
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 미션 목록 조회 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserMissionResponse'

  /api/missions/user/{userId}:
    get:
      tags:
        - Mission
      summary: 특정 사용자 미션 조회
      description: 특정 사용자의 미션 목록을 조회합니다
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: 사용자 ID
      responses:
        '200':
          description: 미션 목록 조회 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserMissionResponse'

  /api/missions/assign/{userId}:
    post:
      tags:
        - Mission
      summary: 미션 할당
      description: 특정 사용자에게 미션을 할당합니다
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: 사용자 ID
      responses:
        '200':
          description: 미션 할당 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'

  # 뱃지 API
  /api/badges/me:
    get:
      tags:
        - Badge
      summary: 내 뱃지 목록 조회
      description: 현재 로그인한 사용자의 모든 뱃지를 조회합니다
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 뱃지 목록 조회 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserBadgeResponse'

  /api/badges/me/acquired:
    get:
      tags:
        - Badge
      summary: 내 획득 뱃지 조회
      description: 현재 로그인한 사용자가 획득한 뱃지만 조회합니다
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 획득 뱃지 조회 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserBadgeResponse'

  /api/badges/award:
    post:
      tags:
        - Badge
      summary: 뱃지 수여
      description: 사용자에게 뱃지를 수여합니다
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - userId
                - badgeId
              properties:
                userId:
                  type: integer
                  format: int64
                  description: 사용자 ID
                badgeId:
                  type: integer
                  format: int64
                  description: 뱃지 ID
      responses:
        '200':
          description: 뱃지 수여 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'

  # 홈 화면 API
  /api/today-plays:
    get:
      tags:
        - Home
      summary: 오늘의 플레이 (전체)
      description: 모든 사용자를 위한 오늘의 추천 플레이를 조회합니다
      security: []
      responses:
        '200':
          description: 오늘의 플레이 조회 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TodayPlayResponse'

  /api/today-plays/user/{userId}:
    get:
      tags:
        - Home
      summary: 개인화된 오늘의 플레이
      description: 특정 사용자를 위한 개인화된 오늘의 플레이를 조회합니다
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: 사용자 ID
      responses:
        '200':
          description: 개인화된 오늘의 플레이 조회 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TodayPlayResponse'

  # 인기 플레이 API (category 파라미터 사용)
  /api/popular-plays/category/{category}:
    get:
      tags:
        - Home
      summary: 카테고리별 인기 플레이
      description: 특정 카테고리의 인기 플레이를 조회합니다
      security: []
      parameters:
        - name: category
          in: path
          required: true
          schema:
            type: string
            enum: [musicals, concerts, sports, exhibitions]
          description: 공연 카테고리
      responses:
        '200':
          description: 인기 플레이 조회 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PopularPlayResponse'

  # 베스트 리뷰 API (category 파라미터 사용)  
  /api/best-reviews/category/{category}:
    get:
      tags:
        - Home
      summary: 카테고리별 베스트 리뷰
      description: 특정 카테고리의 베스트 리뷰를 조회합니다
      security: []
      parameters:
        - name: category
          in: path
          required: true
          schema:
            type: string
            enum: [musicals, concerts, sports, exhibitions]
          description: 공연 카테고리
      responses:
        '200':
          description: 베스트 리뷰 조회 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BestReviewResponse'

  # 베스트 플레이어 API
  /api/best-players:
    get:
      tags:
        - Home
      summary: 베스트 플레이어 목록
      description: 활동량이 높은 베스트 플레이어 목록을 조회합니다
      security: []
      responses:
        '200':
          description: 베스트 플레이어 조회 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BestPlayerResponse'

  /api/best-players/top3:
    get:
      tags:
        - Home
      summary: 베스트 플레이어 TOP 3
      description: 상위 3명의 베스트 플레이어를 조회합니다
      security: []
      responses:
        '200':
          description: 베스트 플레이어 TOP 3 조회 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BestPlayerResponse'

  # 플라자 API
  /api/plaza/reviews:
    get:
      tags:
        - Plaza
      summary: 리뷰 플라자
      description: 플라자의 리뷰 목록 조회
      security: []
      responses:
        '200':
          description: 플라자 리뷰 조회 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ReviewPlazaResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    # 인증 관련 스키마
    KakaoLoginRequest:
      type: object
      required:
        - accessToken
        - email
      properties:
        accessToken:
          type: string
          description: 카카오 액세스 토큰
          example: "kakao_access_token_123"
        email:
          type: string
          format: email
          description: 사용자 이메일
          example: "user@example.com"

    LoginResponse:
      type: object
      properties:
        accessToken:
          type: string
          description: JWT 액세스 토큰
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        refreshToken:
          type: string
          description: JWT 리프레시 토큰
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        userId:
          type: integer
          description: 사용자 ID
          example: 1

    # 사용자 관련 스키마
    UserProfileResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: 사용자 ID
          example: 1
        email:
          type: string
          format: email
          description: 이메일
          example: "user@example.com"
        nickname:
          type: string
          description: 닉네임
          example: "마이플레이어"
        profileImageUrl:
          type: string
          description: 프로필 이미지 URL
          example: "https://example.com/profile.jpg"
        totalReviews:
          type: integer
          description: 총 리뷰 수
          example: 25
        totalPerformances:
          type: integer
          description: 총 관람한 공연 수
          example: 30

    UserExistenceResponse:
      type: object
      properties:
        exists:
          type: boolean
          description: 사용자 존재 여부
          example: true
        message:
          type: string
          description: 메시지
          example: "사용자가 존재합니다."

